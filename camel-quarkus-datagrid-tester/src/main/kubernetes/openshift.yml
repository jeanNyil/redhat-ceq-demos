---
apiVersion: v1
kind: ConfigMap
metadata:
  name: camel-quarkus-datagrid-tester-config
data:
  datagrid.caches.fruits-legumes: fruits-legumes-replicated-cache
  datagrid.caches.idempotency: idempotency-replicated-cache
  s3.endpoint: https://s3.openshift-storage.svc:443
  s3.region: us-east-1
  s3.bucket-name: camel-quarkus-datagrid-tester-s3bucket
  s3.delete-after-read: "false"
  s3.next-poll-delay-in-ms: "30000"
  quarkus.otel.exporter.otlp.endpoint: http://otel-collector.observability.svc:4317
---
apiVersion: v1
kind: Secret
metadata:
  name: camel-quarkus-datagrid-tester-secret
stringData:
  quarkus.infinispan-client.hosts: <CHANGEME_HOSTNAME>:<CHANGEME_PORT>
  quarkus.infinispan-client.auth-server-name: <CHANGEME_CLUSTERNAME>
  quarkus.infinispan-client.username: <CHANGEME_USERNAME>
  quarkus.infinispan-client.password: <CHANGEME_PASSWORD>
  quarkus.infinispan-client.client-intelligence: HASH_DISTRIBUTION_AWARE
  quarkus.infinispan-client.sasl-mechanism: PLAIN
  quarkus.infinispan-client.sni-host-name: <CHANGEME_HOSTNAME>
  quarkus.infinispan-client.trust-store: /mnt/ssl/truststore.p12
  quarkus.infinispan-client.trust-store-password: P@ssw0rd
type: Opaque
---
# Generate a ServiceMonitor resource for the camel-quarkus-datagrid-tester service.
# S3 credentials are in the ObjectBucketClaim Secret camel-quarkus-datagrid-tester-s3bucket.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: camel-quarkus-datagrid-tester
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: camel-quarkus-datagrid-tester
      app.kubernetes.io/version: 1.0.0
  endpoints:
    - scheme: http
      targetPort: 9876
      path: /observe/metrics
      interval: 10s
      honorLabels: true
