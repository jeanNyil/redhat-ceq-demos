# One OperatorGroup per namespace. SKIP this file when an OperatorGroup
# already exists in openshift-storage (LVM Storage typically creates one):
#   oc get operatorgroup -n openshift-storage
#
# Do NOT create a second OperatorGroup in openshift-storage.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-storage-operatorgroup
  namespace: openshift-storage
spec:
  targetNamespaces:
  - openshift-storage
